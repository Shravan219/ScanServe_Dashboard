<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E2B3" />
      <stop offset="30%" stop-color="#C5A059" />
      <stop offset="70%" stop-color="#9A7B38" />
      <stop offset="100%" stop-color="#DFBA6B" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base Circle / Shield Container -->
  <rect width="100" height="100" rx="24" fill="#0A0A0E" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <g transform="translate(0, 2)" filter="url(#subtleGlow)">
    <!-- Outer Shield Chevron Framing -->
    <path 
      d="M22 28 L32 28 L40 44 L50 64 L60 44 L68 28 L78 28 L50 86 Z" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="3" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- Inner Sharp Monogram V -->
    <path 
      d="M34 38 L50 72 L66 38" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="2.5" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- Upper Michelin Cloche Dome -->
    <path 
      d="M36 38 C36 28 42 22 50 22 C58 22 64 28 64 38 Z" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="2.5" 
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- Cloche Finial / Top Handle -->
    <circle cx="50" cy="19.5" r="2.5" fill="url(#goldGrad)" />

    <!-- Left Wing Flares -->
    <path 
      d="M34 38 C26 34 16 32 12 28 C14 36 22 41 32 44" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <path 
      d="M31 43 C22 42 16 43 14 39 C17 45 24 48 33 49" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="1.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Right Wing Flares -->
    <path 
      d="M66 38 C74 34 84 32 88 28 C86 36 78 41 68 44" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <path 
      d="M69 43 C78 42 84 43 86 39 C83 45 76 48 67 49" 
      fill="none" 
      stroke="url(#goldGrad)" 
      stroke-width="1.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Cloche Platter Tray Line -->
    <line x1="30" y1="40" x2="70" y2="40" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
